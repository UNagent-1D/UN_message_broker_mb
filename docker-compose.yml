services:
  rabbitmq:
    build: .
    container_name: archsoft-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - archsoft

networks:
  archsoft:
    driver: bridge

volumes:
  rabbitmq-data:
